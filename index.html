<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>异兽餐车</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="异兽餐车">
<meta name="theme-color" content="#14111c">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
<style>
/* 一屏游戏：画布铺满，外加加载层与“请横屏”层。单一夜色主题，与游戏画风一致 */
:root {
  --night: #14111c;
  --sea: #2c2a5c;
  --rust: #c8642a;
  --paper: #efe2c4;
  --ink: #0b0908;
  --mist: #a8a3c9;
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
  --ui: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--night); color: var(--paper); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

#stage { position: fixed; inset: 0; background: var(--ink); touch-action: none; }
#canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

#boot {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(ellipse 90% 55% at 50% 118%, rgba(200,100,42,.28), transparent 70%),
    linear-gradient(180deg, var(--night) 0%, var(--sea) 72%, #1b1830 100%);
  transition: opacity .5s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
.card { display: grid; gap: 14px; justify-items: center; text-align: center; width: min(520px, 100%); }
.eye {
  width: 64px; height: 28px; border: 3px solid var(--ink); border-radius: 50%;
  background: #dccd8c; position: relative; box-shadow: 0 0 0 2px rgba(239,226,196,.15);
  animation: blink 4.2s infinite;
}
.eye::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 15px; height: 22px; transform: translate(-50%,-50%);
  background: radial-gradient(ellipse 22% 48% at 50% 50%, var(--ink) 95%, transparent 100%), #9e4b1c;
  border-radius: 50%;
}
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.08) } }
h1 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: clamp(40px, 9vmin, 72px); line-height: 1; letter-spacing: .08em; color: var(--paper); text-shadow: 3px 3px 0 var(--ink); text-wrap: balance; }
.sub { margin: 0; font-size: 14px; letter-spacing: .3em; color: var(--mist); }
.bar { width: 100%; height: 14px; border: 3px solid var(--ink); border-radius: 8px; background: rgba(11,9,8,.55); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, var(--rust) 0 10px, #a94f1f 10px 20px); transition: width .2s linear; }
#status { margin: 0; font-size: 13px; color: var(--mist); font-variant-numeric: tabular-nums; min-height: 1.4em; }
.tip { margin: 6px 0 0; font-size: 12px; line-height: 1.6; color: rgba(168,163,201,.75); max-width: 40ch; }
.tip b { color: var(--paper); font-weight: 600; }
#status.err { color: #ff9a7a; }

#rotate {
  position: fixed; inset: 0; z-index: 10; display: none;
  place-items: center; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--night);
}
@media (orientation: portrait) { #rotate { display: grid; } }
#rotate .card { gap: 18px; }
.phone {
  width: 54px; height: 92px; border: 4px solid var(--paper); border-radius: 12px; position: relative;
  animation: turn 2.4s ease-in-out infinite;
}
.phone::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 16px; height: 3px; border-radius: 2px; background: var(--paper); transform: translateX(-50%); }
@keyframes turn { 0%, 25% { transform: rotate(0) } 55%, 85% { transform: rotate(-90deg) } 100% { transform: rotate(0) } }
#rotate h2 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 34px; letter-spacing: .06em; }
#rotate p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--mist); max-width: 30ch; }
@media (prefers-reduced-motion: reduce) { .phone, .eye { animation: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1">你的浏览器不支持 HTML5 画布。</canvas></div>

<div id="boot" role="status" aria-live="polite">
  <div class="card">
    <div class="eye" aria-hidden="true"></div>
    <h1>异兽餐车</h1>
    <p class="sub">手机横屏试玩</p>
    <div class="bar"><i id="fill"></i></div>
    <p id="status">准备中…</p>
    <p class="tip">首次打开约下载 70 MB，建议连 Wi-Fi，之后会快很多。<br>声音没出来？检查手机侧面的<b>静音开关</b>。</p>
    <p class="tip" id="hs" hidden>想全屏玩：点 Safari 的<b>分享</b>按钮 →<b>添加到主屏幕</b>，以后从桌面图标打开就没有地址栏。</p>
  </div>
</div>

<div id="rotate">
  <div class="card">
    <div class="phone" aria-hidden="true"></div>
    <h2>把手机横过来</h2>
    <p>游戏是横屏玩的。转不过来的话，从右上角下拉控制中心，关掉「竖排方向锁定」。</p>
  </div>
</div>

<script>
/* 安全区：游戏里的 SafeArea.gd 通过 JavaScriptBridge 调这个函数，把按钮挪出刘海和底部横条 */
(function () {
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;' +
    'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);' +
    'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);';
  document.documentElement.appendChild(probe);
  window.__safeInsets = function () {
    var cs = getComputedStyle(probe);
    var c = document.getElementById('canvas').getBoundingClientRect();
    return {
      left: parseFloat(cs.paddingLeft) || 0, right: parseFloat(cs.paddingRight) || 0,
      top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0,
      w: c.width || window.innerWidth, h: c.height || window.innerHeight
    };
  };
})();

/* 禁止 Safari 的双指缩放、页面拖动和长按菜单，避免和游戏拖拽打架 */
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
  document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* 引擎主体 index.side.wasm 以 gzip 发布（44 MB → 10 MB），在浏览器里边下边解压；
   游戏数据包 index.pck 切成四块发布（每块不超过 15 MB），在这里按顺序拼回去 */
(function () {
  var origFetch = window.fetch.bind(window);
  var MAP = {
    'index.side.wasm': ['engine-gz.wasm'],
    'index.pck': ['game-data-0.wasm', 'game-data-1.wasm', 'game-data-2.wasm', 'game-data-3.wasm']
  };
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var m = url.match(/(^|\/)(index\.(side\.wasm|pck))(\?|#|$)/);
    if (!m) return origFetch(input, init);
    var name = m[2];
    var parts = MAP[name].map(function (p) { return url.replace(name, p); });
    var isWasm = name !== 'index.pck';
    var idx = 0, reader = null;
    function openNext() {
      return origFetch(parts[idx], init).then(function (res) {
        if (!res.ok) throw new Error(res.status + ' : ' + parts[idx]);
        reader = res.body.getReader();
      });
    }
    return openNext().then(function () {
      var raw = new ReadableStream({
        pull: function (ctl) {
          function step() {
            return reader.read().then(function (r) {
              if (!r.done) { ctl.enqueue(r.value); return; }
              idx++;
              if (idx >= parts.length) { ctl.close(); return; }
              return openNext().then(step);
            });
          }
          return step();
        }
      });
      /* 看头两个字节判断是不是 gzip */
      var rr = raw.getReader();
      return rr.read().then(function (first) {
        var head = first.value || new Uint8Array(0);
        var gz = head.length > 1 && head[0] === 0x1f && head[1] === 0x8b;
        var body = new ReadableStream({
          start: function (ctl) {
            if (head.length) ctl.enqueue(head);
            if (first.done) { ctl.close(); return; }
            (function pump() {
              rr.read().then(function (r) {
                if (r.done) { ctl.close(); return; }
                ctl.enqueue(r.value); pump();
              }, function (e) { ctl.error(e); });
            })();
          }
        });
        if (gz) {
          if (typeof DecompressionStream === 'undefined') throw new Error('NO_DECOMPRESS');
          body = body.pipeThrough(new DecompressionStream('gzip'));
        }
        return new Response(body, { headers: { 'Content-Type': isWasm ? 'application/wasm' : 'application/octet-stream' } });
      });
    });
  };
})();
</script>
<script src="index.js"></script>
<script>
(function () {
  var boot = document.getElementById('boot');
  var fill = document.getElementById('fill');
  var status = document.getElementById('status');
  function fail(msg) { status.textContent = msg; status.className = 'err'; }
  try {
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    if (ios && !navigator.standalone && window.top === window) document.getElementById('hs').hidden = false;
  } catch (e) {}

  if (typeof Engine === 'undefined') { fail('游戏文件没有加载出来，请刷新重试。'); return; }
  var missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail('这个浏览器缺少：' + missing.join('、') + '。请用 iOS 16.4 以上的 Safari 打开。'); return; }
  if (typeof DecompressionStream === 'undefined') { fail('请把 iPhone 升级到 iOS 16.4 或更新版本后再打开。'); return; }

  var engine = new Engine({
    args: [], canvas: document.getElementById('canvas'), canvasResizePolicy: 2,
    ensureCrossOriginIsolationHeaders: false, executable: 'index', experimentalVK: false,
    emscriptenPoolSize: 8, godotPoolSize: 4,
    fileSizes: { 'index.pck': 50750392, 'index.wasm': 1508095 },
    focusCanvas: true,
    gdextensionLibs: ['libspine_godot.web.template_release.wasm32.nothreads.wasm']
  });
  status.textContent = '正在下载 0%';
  engine.startGame({
    onProgress: function (cur, total) {
      if (total > 0) {
        var p = Math.min(100, Math.round(cur / total * 100));
        fill.style.width = p + '%';
        status.textContent = p < 100 ? '正在下载 ' + p + '%' : '正在启动…';
      }
    }
  }).then(function () {
    fill.style.width = '100%';
    status.textContent = '点一下画面开始';
    setTimeout(function () { boot.classList.add('gone'); }, 400);
  }, function (err) {
    var m = String(err && err.message || err);
    fail(m.indexOf('NO_DECOMPRESS') >= 0 ? '请把 iPhone 升级到 iOS 16.4 或更新版本后再打开。' : '启动失败：' + m + '。请刷新重试。');
  });
})();
</script>
</body>
</html>
